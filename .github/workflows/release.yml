name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported glibc, so the binary runs on more distros
            asset: sysglance-linux-x64
            built: dist/sysglance
          - os: windows-latest
            asset: sysglance-windows-x64.exe
            built: dist/sysglance.exe
    env:
      COLUMNS: "120"
      LINES: "35"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        shell: bash
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sysglance/__init__.py | tr -d '\r')
          test "$GITHUB_REF_NAME" = "v$ver"
      - run: python -m pip install ".[test]" pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller --onefile --console --name sysglance packaging/launch.py
      - name: Smoke test the binary
        shell: bash
        run: |
          ${{ matrix.built }} --version
          ${{ matrix.built }} --once
      - shell: bash
        run: mv ${{ matrix.built }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "sysglance ${GITHUB_REF_NAME#v}" --generate-notes
